name: ponyc Weekly Checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out and test (branch, tag, or SHA)"
        required: false
        default: "main"
  schedule:
    - cron: "0 3 * * 4"

concurrency:
  group: ponyc-weekly-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write (not read) so a non-`main` workflow_dispatch can push its libs build to
  # the branch scratch cache (`--branch-cache`), to reuse across dispatches and to
  # let the warmer promote it after merge. workflow_dispatch/schedule are non-fork,
  # so the write token is only ever available to repo-authorized actors.
  packages: write

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          elif git log --since="7 days ago" --oneline | head -1 | grep -q .; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

  # -- Chain layout ----------------------------------------------------------
  # Jobs are chained so at most two run concurrently. Matrix jobs use
  # max-parallel: 2. Every step past the first uses !cancelled() so a failure
  # in one job doesn't block the rest of the chain. Sanitizer jobs come last.

  # == Step 1 =================================================================

  use_directives:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            debugger: lldb
            directives: dtrace
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            debugger: lldb
            directives: pool_memalign
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            debugger: lldb
            directives: pool_classic
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            debugger: lldb
            directives: pool_classic,pool_retain
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            debugger: lldb
            directives: runtimestats
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            debugger: lldb
            directives: runtime_tracing
          # runtime_tracing's format specifiers for the runtimestats-gated fields
          # only compile in this combined build, so cover it explicitly.
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            debugger: lldb
            directives: runtime_tracing,runtimestats

    name: use ${{ matrix.directives }}
    container:
      image: ${{ matrix.image }}
      options: --user pony --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ${{ matrix.image }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Debug Runtime
        run: |
          cmake --preset x86-64-debug -DPONY_USES=${{ matrix.directives }}
          cmake --build --preset x86-64-debug
      - name: Verify dtrace build leaves the source tree clean
        if: matrix.directives == 'dtrace'
        # #5401: dtrace_probes.h must be generated into the build tree,
        # never written back into src/common.
        run: test ! -f src/common/dtrace_probes.h
      - name: Test with Debug Runtime
        run: |
          PONY_TEST_DEBUGGER="$(.ci-scripts/test-debugger.sh ${{ matrix.debugger }})"
          export PONY_TEST_DEBUGGER
          export PONY_FULL_PROGRAM_TIMEOUT=120
          ctest --preset x86-64-debug -L ci-core
      - name: Build Release Runtime
        run: |
          cmake --preset x86-64-release -DPONY_USES=${{ matrix.directives }}
          cmake --build --preset x86-64-release
      - name: Test with Release Runtime
        run: |
          PONY_TEST_DEBUGGER="$(.ci-scripts/test-debugger.sh ${{ matrix.debugger }})"
          export PONY_TEST_DEBUGGER
          ctest --preset x86-64-release -L ci-core
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # == Step 2 =================================================================

  coverage:
    needs: [check-for-changes, use_directives]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    # use=coverage takes a different runtime path per toolchain: clang's
    # -fprofile-instr-generate (libclang_rt.profile / .profraw) and gcc's
    # -fprofile-arcs (libgcov / .gcda). The embedded LLD link splices each in (see
    # genexe.cc + the top-level CMakeLists.txt), so exercise both compilers.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            cc: clang
            cxx: clang++
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            cc: gcc
            cxx: g++

    name: use coverage (${{ matrix.cc }})
    container:
      image: ${{ matrix.image }}
      options: --user pony --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ${{ matrix.image }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Coverage smoke test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: sh .ci-scripts/linux-coverage-smoke.sh
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # == Step 3 =================================================================

  # Windows counterpart of the use_directives job above. Windows needs a separate
  # job: a windows runner and the multi-config Visual Studio generator rather than
  # the Ubuntu container matrix. Add rows as more Windows-supported options become
  # worth checking here.
  use_directives_windows:
    needs: [check-for-changes, coverage]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - directives: runtime_tracing
          # runtime_tracing's format specifiers for the runtimestats-gated fields
          # only compile in this combined build, so cover it explicitly.
          - directives: runtime_tracing,runtimestats
          # Windows defaults to the arena allocator, so this row builds the
          # classic pool there, as PonyUses.cmake requires for every entry in
          # its Windows allowlist.
          - directives: pool_classic
    name: 'use ${{ matrix.directives }} (Windows)'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Dependencies
        run: .\.ci-scripts\windows-install-deps.ps1
      - name: Install LibreSSL
        run: .\.ci-scripts\windows-install-libressl.ps1
      - name: Configure Networking
        run: .\.ci-scripts\windows-configure-networking.ps1
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --platform windows-2025-vs2026 --tag "$env:LIBS_TAG" '--' cmake -DPRESET=libs-windows-x86-64 -DJOBS=4 -P lib/build-libs.cmake
      - name: Configure
        # Quote the arg: a matrix value with a comma (e.g. runtime_tracing,runtimestats)
        # is otherwise parsed by pwsh as an array and breaks the command.
        run: cmake --preset windows-x86-64 "-DPONY_USES=${{ matrix.directives }}"
      - name: Build Debug Runtime
        run: cmake --build --preset windows-x86-64-debug
      - name: Test with Debug Runtime
        run: |
          $env:PONY_TEST_DEBUGGER = & .ci-scripts/test-debugger.ps1 lldb
          ctest --preset windows-x86-64-debug -L ci-core
      - name: Build Release Runtime
        run: cmake --build --preset windows-x86-64-release
      - name: Test with Release Runtime
        run: |
          $env:PONY_TEST_DEBUGGER = & .ci-scripts/test-debugger.ps1 lldb
          ctest --preset windows-x86-64-release -L ci-core
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # == Step 4 =================================================================

  runtimebc:
    needs: [check-for-changes, use_directives_windows]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    # PONY_RUNTIME_BITCODE builds every libponyrt .c file to LLVM bitcode and
    # links them into libponyrt.bc with llvm-link. ponyc --runtimebc then merges
    # that bitcode into the program's IR before optimisation, enabling cross-module
    # interprocedural optimisation between Pony code and the runtime ("super LTO").
    # Clang-only; incompatible with use=dtrace.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908

    name: runtimebc
    container:
      image: ${{ matrix.image }}
      options: --user pony
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ${{ matrix.image }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Runtime bitcode smoke test
        run: sh .ci-scripts/linux-runtimebc-smoke.sh
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  systematic_testing_tests:
    needs: [check-for-changes, use_directives_windows]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    # Tests that the systematic-testing feature still works (currently the
    # reproducibility smoke; more systematic-testing checks can be added here).
    # Single config for now (x86-64 Linux, debug); the smoke script asserts a
    # property, not a platform-specific signature value, so it can be extended to
    # more images/configs by adding matrix rows. This image is already a warmer
    # platform (shared with the other Linux jobs here), so it needs no new entry
    # in update-lib-cache.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908

    name: systematic testing tests
    container:
      image: ${{ matrix.image }}
      options: --user pony
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ${{ matrix.image }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Determinism smoke test
        run: python3 .ci-scripts/systematic-testing/determinism_smoke.py
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # == Step 5 =================================================================

  always_assert:
    needs: [check-for-changes, runtimebc, systematic_testing_tests]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    # Builds the runtime optimized (release) with its asserts and the arena
    # allocator's integrity checks kept in, via -DPONY_ALWAYS_ASSERT=ON. A plain
    # release compiles those checks out; the debug suites run them but
    # unoptimized. This is the only lane that runs them against optimized code,
    # where the compiler can expose ordering or undefined behavior the checks
    # then catch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
            debugger: lldb

    name: release with always-assert
    container:
      image: ${{ matrix.image }}
      options: --user pony --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ${{ matrix.image }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Release Runtime with always-assert
        run: |
          cmake --preset x86-64-release -DPONY_ALWAYS_ASSERT=ON
          cmake --build --preset x86-64-release
      - name: Test with Release Runtime
        run: |
          PONY_TEST_DEBUGGER="$(.ci-scripts/test-debugger.sh ${{ matrix.debugger }})"
          export PONY_TEST_DEBUGGER
          export PONY_FULL_PROGRAM_TIMEOUT=120
          ctest --preset x86-64-release -L ci-core
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  arm64_macos_dtrace_smoke:
    needs: [check-for-changes, runtimebc, systematic_testing_tests]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: macos-26

    name: arm64 Apple Darwin dtrace smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --platform arm64-macos-26 --tag "$LIBS_TAG" -- cmake -DJOBS=3 -P lib/build-libs.cmake
      - name: DTrace Smoke Test
        run: bash .ci-scripts/macos-dtrace-smoke.sh
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # == Step 6 =================================================================

  x86_64_macos_dtrace_smoke:
    needs: [check-for-changes, always_assert, arm64_macos_dtrace_smoke]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: macos-15-intel

    name: x86-64 Apple Darwin dtrace smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --platform x86-macos-15-intel --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: DTrace Smoke Test
        run: bash .ci-scripts/macos-dtrace-smoke.sh
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # ----- vanilla ci-core full matrix (moved from PR CI) -----
  # PR CI runs only debug-runtime + debug-ponyc. These jobs cover the three
  # remaining configurations: debug-runtime + release-ponyc, release-runtime +
  # debug-ponyc, release-runtime + release-ponyc. Both runtimes are built and
  # the full ci-core label runs against each.

  x86_64_linux_glibc:
    needs: [check-for-changes, always_assert, arm64_macos_dtrace_smoke]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    name: ci-core x86-64 Linux glibc
    container:
      image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
      options: --user pony --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Debug Runtime
        run: |
          cmake --preset x86-64-debug
          cmake --build --preset x86-64-debug
      - name: Test with Debug Runtime
        run: |
          PONY_TEST_DEBUGGER="$(.ci-scripts/test-debugger.sh lldb)"
          export PONY_TEST_DEBUGGER
          ctest --preset x86-64-debug -L ci-core
      - name: Build Release Runtime
        run: |
          cmake --preset x86-64-release
          cmake --build --preset x86-64-release
      - name: Test with Release Runtime
        run: |
          PONY_TEST_DEBUGGER="$(.ci-scripts/test-debugger.sh lldb)"
          export PONY_TEST_DEBUGGER
          ctest --preset x86-64-release -L ci-core
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # == Step 7 =================================================================

  arm64_macos:
