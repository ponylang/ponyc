name: Build Builder Image

on:
  workflow_dispatch:
    inputs:
      builder-name:
        description: "Builder"
        required: true
        type: choice
        options:
          - alpine3.23-builder
          - alpine3.24-builder
          - arm64-unknown-linux-ubuntu24.04-builder
          - cross-riscv64
          - ubuntu26.04-builder
          - ubuntu26.04-builder-with-libressl-3.9.2
          - ubuntu26.04-builder-with-libressl-4.2.1
          - ubuntu26.04-builder-with-openssl-1.1.1w
          - ubuntu26.04-builder-with-openssl-3.6.2
          - ubuntu26.04-builder-with-openssl-4.0.0
          - x86-64-unknown-linux-fedora44-builder
          - x86-64-unknown-linux-ubuntu24.04-builder

permissions:
  contents: write
  packages: write

jobs:
  alpine3_23-builder:
    if: ${{ github.event.inputs.builder-name == 'alpine3.23-builder' }}
    runs-on: ubuntu-latest

    name: alpine3.23-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up Docker Buildx
        # v3.10.0
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.23.0
          cache-binary: false
      - name: Login to GitHub Container Registry
        # v2.2.0
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: bash .ci-dockerfiles/alpine3.23-builder/build-and-push.bash

  alpine3_24-builder:
    if: ${{ github.event.inputs.builder-name == 'alpine3.24-builder' }}
    runs-on: ubuntu-latest

    name: alpine3.24-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up Docker Buildx
        # v3.10.0
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.23.0
          cache-binary: false
      - name: Login to GitHub Container Registry
        # v2.2.0
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: bash .ci-dockerfiles/alpine3.24-builder/build-and-push.bash

  arm64-unknown-linux-ubuntu24_04-builder:
    if: ${{ github.event.inputs.builder-name == 'arm64-unknown-linux-ubuntu24.04-builder' }}
    runs-on: ubuntu-24.04-arm

    name: arm64-unknown-linux-ubuntu24.04-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up Docker Buildx
        # v3.10.0
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.23.0
          cache-binary: false
      - name: Login to GitHub Container Registry
        # v2.2.0
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: bash .ci-dockerfiles/arm64-unknown-linux-ubuntu24.04-builder/build-and-push.bash

  cross-riscv64:
    if: ${{ github.event.inputs.builder-name == 'cross-riscv64' }}
    runs-on: ubuntu-latest

    name: cross-riscv64
