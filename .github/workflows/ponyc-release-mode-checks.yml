name: ponyc Release-Mode Checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out and test (branch, tag, or SHA)"
        required: false
        default: "main"
  schedule:
    - cron: "0 2 * * 2,4,6"

concurrency:
  group: ponyc-release-mode-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          elif git log --since="3 days ago" --oneline | head -1 | grep -q .; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

  # -- Chain layout ----------------------------------------------------------
  # Jobs are chained in three waves (3-3-4). Every wave past the first uses
  # !cancelled() so a failure in one job doesn't block the rest.

  # == Wave 1 =================================================================

  x86_64_linux_musl_alpine323:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    name: x86-64 Linux musl alpine3.23
    container:
      image: ghcr.io/ponylang/ponyc-ci-alpine3.23-builder:20260908
      options: --user pony --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ghcr.io/ponylang/ponyc-ci-alpine3.23-builder:20260908
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Release Runtime
        run: |
          cmake --preset x86-64-release
          cmake --build --preset x86-64-release
      - name: Test with Release Runtime
        run: |
          PONY_DEBUG=1 ctest --preset x86-64-release -L ci-core
          ctest --preset x86-64-release -R "^(stdlib|full-programs)$"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  x86_64_linux_musl_alpine324:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    name: x86-64 Linux musl alpine3.24
    container:
      image: ghcr.io/ponylang/ponyc-ci-alpine3.24-builder:20260908
      options: --user pony --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ghcr.io/ponylang/ponyc-ci-alpine3.24-builder:20260908
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Release Runtime
        run: |
          cmake --preset x86-64-release
          cmake --build --preset x86-64-release
      - name: Test with Release Runtime
        run: |
          PONY_DEBUG=1 ctest --preset x86-64-release -L ci-core
          ctest --preset x86-64-release -R "^(stdlib|full-programs)$"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  x86_64_macos:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: macos-15-intel
    name: x86-64 Apple Darwin
    env:
      PONY_FULL_PROGRAM_TIMEOUT: "180"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --platform x86-macos-15-intel --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Release Runtime
        run: |
          cmake --preset x86-64-release
          cmake --build --preset x86-64-release
      - name: Test with Release Runtime
        run: |
          PONY_DEBUG=1 ctest --preset x86-64-release -L ci-core
          ctest --preset x86-64-release -R "^(stdlib|full-programs)$"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # == Wave 2 =================================================================

  arm64_linux_glibc:
    needs: [check-for-changes, x86_64_linux_musl_alpine323, x86_64_linux_musl_alpine324, x86_64_macos]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04-arm
    name: arm64 Linux glibc
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Docker image
        run: docker pull ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
      - name: Build libs
        env:
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: |
          docker run --rm \
            --user pony \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e GITHUB_REPOSITORY \
            -e GITHUB_ACTOR \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908 \
            python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Release Runtime
        run: |
          docker run --rm \
            --user pony \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908 \
            bash -c "cmake --preset armv8-a-release && cmake --build --preset armv8-a-release"
      - name: Test with Release Runtime
        run: |
          docker run --rm \
            --user pony \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908 \
            bash -c "PONY_DEBUG=1 ctest --preset armv8-a-release -L ci-core && ctest --preset armv8-a-release -R '^(stdlib|full-programs)$'"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  arm64_linux_musl_alpine323:
    needs: [check-for-changes, x86_64_linux_musl_alpine323, x86_64_linux_musl_alpine324, x86_64_macos]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04-arm
    name: arm64 Linux musl alpine3.23
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Docker image
        run: docker pull ghcr.io/ponylang/ponyc-ci-alpine3.23-builder:20260908
      - name: Build libs
        env:
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: |
          docker run --rm \
            --user pony \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e GITHUB_REPOSITORY \
            -e GITHUB_ACTOR \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-alpine3.23-builder:20260908 \
            python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "ghcr.io/ponylang/ponyc-ci-alpine3.23-builder:20260908" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Release Runtime
        run: |
          docker run --rm \
            --user pony \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-alpine3.23-builder:20260908 \
            bash -c "cmake --preset armv8-a-release && cmake --build --preset armv8-a-release"
      - name: Test with Release Runtime
        run: |
          docker run --rm \
            --user pony \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-alpine3.23-builder:20260908 \
            bash -c "PONY_DEBUG=1 ctest --preset armv8-a-release -L ci-core && ctest --preset armv8-a-release -R '^(stdlib|full-programs)$'"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  arm64_linux_musl_alpine324:
    needs: [check-for-changes, x86_64_linux_musl_alpine323, x86_64_linux_musl_alpine324, x86_64_macos]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04-arm
    name: arm64 Linux musl alpine3.24
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Docker image
        run: docker pull ghcr.io/ponylang/ponyc-ci-alpine3.24-builder:20260908
      - name: Build libs
        env:
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: |
          docker run --rm \
            --user pony \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e GITHUB_REPOSITORY \
            -e GITHUB_ACTOR \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-alpine3.24-builder:20260908 \
            python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "ghcr.io/ponylang/ponyc-ci-alpine3.24-builder:20260908" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Release Runtime
        run: |
          docker run --rm \
            --user pony \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-alpine3.24-builder:20260908 \
            bash -c "cmake --preset armv8-a-release && cmake --build --preset armv8-a-release"
      - name: Test with Release Runtime
        run: |
          docker run --rm \
            --user pony \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v ${{ github.workspace }}:/home/pony/project \
            -w /home/pony/project \
            ghcr.io/ponylang/ponyc-ci-alpine3.24-builder:20260908 \
            bash -c "PONY_DEBUG=1 ctest --preset armv8-a-release -L ci-core && ctest --preset armv8-a-release -R '^(stdlib|full-programs)$'"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  # == Wave 3 =================================================================

  x86_64_linux_glibc:
    needs: [check-for-changes, arm64_linux_glibc, arm64_linux_musl_alpine323, arm64_linux_musl_alpine324]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    name: x86-64 Linux glibc
    container:
      image: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
      options: --user pony --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_IMAGE: ghcr.io/ponylang/ponyc-ci-ubuntu26.04-builder:20260908
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --image "$LIBS_IMAGE" --tag "$LIBS_TAG" -- cmake -DJOBS=4 -P lib/build-libs.cmake
      - name: Build Release Runtime
        run: |
          cmake --preset x86-64-release
          cmake --build --preset x86-64-release
      - name: Test with Release Runtime
        run: |
          PONY_TEST_DEBUGGER="$(.ci-scripts/test-debugger.sh lldb)"
          export PONY_TEST_DEBUGGER
          PONY_DEBUG=1 ctest --preset x86-64-release -L ci-core
          ctest --preset x86-64-release -R "^(stdlib|full-programs)$"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  arm64_macos:
    needs: [check-for-changes, arm64_linux_glibc, arm64_linux_musl_alpine323, arm64_linux_musl_alpine324]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: macos-26
    name: arm64 macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python3 .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --platform arm64-macos-26 --tag "$LIBS_TAG" -- cmake -DJOBS=3 -P lib/build-libs.cmake
      - name: Build Release Runtime
        run: |
          cmake --preset armv8-release
          cmake --build --preset armv8-release
      - name: Test with Release Runtime
        run: |
          PONY_DEBUG=1 ctest --preset armv8-release -L ci-core
          ctest --preset armv8-release -R "^(stdlib|full-programs)$"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  x86_64_windows:
    needs: [check-for-changes, arm64_linux_glibc, arm64_linux_musl_alpine323, arm64_linux_musl_alpine324]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    name: x86-64 Windows MSVC
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Dependencies
        run: .\.ci-scripts\windows-install-deps.ps1
      - name: Install LibreSSL
        run: .\.ci-scripts\windows-install-libressl.ps1
      - name: Configure Networking
        run: .\.ci-scripts\windows-configure-networking.ps1
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --platform windows-2025-vs2026 --tag "$env:LIBS_TAG" '--' cmake -DPRESET=libs-windows-x86-64 -DJOBS=4 -P lib/build-libs.cmake
      - name: Configure
        run: cmake --preset windows-x86-64
      - name: Build Release Runtime
        run: cmake --build --preset windows-x86-64-release
      - name: Test with Release Runtime
        run: |
          $env:PONY_TEST_DEBUGGER = & .ci-scripts/test-debugger.ps1 lldb
          $env:PONY_DEBUG = "1"
          ctest --preset windows-x86-64-release -L ci-core
          Remove-Item Env:PONY_DEBUG
          ctest --preset windows-x86-64-release -R "^(stdlib|full-programs)$"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

  arm64_windows:
    needs: [check-for-changes, arm64_linux_glibc, arm64_linux_musl_alpine323, arm64_linux_musl_alpine324]
    if: >-
      !cancelled() &&
      needs.check-for-changes.outputs.has-changes == 'true'
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    name: arm64 Windows MSVC
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install LibreSSL
        run: .\.ci-scripts\windows-install-libressl.ps1
      - name: Configure Networking
        run: .\.ci-scripts\windows-configure-networking.ps1
      - name: Build libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('lib/CMakePresets.json', 'CMakeLists.txt', 'lib/CMakeLists.txt', 'lib/build-libs.cmake', 'lib/llvm/patches/*') }}
        run: python .ci-scripts/libs-cache/resolve_libs_cache.py --branch-cache --platform windows-11-arm --tag "$env:LIBS_TAG" '--' cmake -DPRESET=libs-windows-arm64 -DJOBS=4 -P lib/build-libs.cmake
      - name: Configure
        run: cmake --preset windows-arm64
      - name: Build Release Runtime
        run: cmake --build --preset windows-arm64-release
      - name: Test with Release Runtime
        run: |
          $env:PONY_DEBUG = "1"
          ctest --preset windows-arm64-release -L ci-core
          Remove-Item Env:PONY_DEBUG
          ctest --preset windows-arm64-release -R "^(stdlib|full-programs)$"
      - name: Send alert on failure
        if: ${{ failure() }}
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa
        with:
          api-key: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_API_KEY }}
          email: ${{ secrets.ZULIP_SCHEDULED_JOB_FAILURE_EMAIL }}
          organization-url: 'https://ponylang.zulipchat.com/'
          to: notifications
          type: stream
          topic: ${{ github.repository }} scheduled job failure
          content: ${{ github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.
